<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X271RK6RRK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X271RK6RRK');
    </script>
</head>
<body>

<!-- Test Button to Open Modal -->
<div class="container mt-5">
    <div class="row">
        <div class="col-12 text-center">
            <h1>Test Contact Form</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal">
                Open Contact Form
            </button>
        </div>
    </div>
</div>

<!-- MODAL FORMULARIO DE CONTACTO -->
<div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- modal header -->
            <div class="modal-header">
                <h1 class="modal-title fs-4 bolder" id="contactModalLabel">Let's Talk!</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- modal body -->
            <div class="modal-body p-4">
                <!-- Formulario de contacto -->
                <div id="contactFormContainer">
                    <form id="contactForm" action="https://formspree.io/f/xgvzgrzj" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message *</label>
                            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-secondary">Send Message</button>
                        </div>
                    </form>
                </div>

                <!-- Mensaje de confirmación -->
                <div id="successMessage" class="success-message d-none">
                    <div class="text-center">
                        <div class="success-icon mb-3">
                            <i class="fa-solid fa-check-circle"></i>
                        </div>
                        <h4 class="success-title mb-3">Message Sent Successfully!</h4>
                        <p class="success-text mb-4">Thank you for reaching out. I'll get back to you soon!</p>
                        <button type="button" class="btn btn-primary" onclick="closeModal()">Close</button>
                    </div>
                </div>
            </div>
            <!-- modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Contact Form JS -->
<script src="contact-form.js"></script>

<!-- Analytics JS -->
<script src="assets/js/analytics.js"></script>

</body>
</html>
